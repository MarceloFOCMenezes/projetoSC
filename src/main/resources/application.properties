spring.application.name=projetosc

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# habilita o console web do h2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# habilita que os comandos sql sejam mostrados no log
spring.jpa.show-sql=true

# determina que os SQL do log sejam formatados
spring.jpa.properties.hibernate.format_sql=true

# permite que o data.sql seja executado no momento certos
spring.jpa.defer-datasource-initialization=true

# as duas linhas abaixo são para habilitar os detalhes dos erros de validacao
server.error.include-message=always
server.error.include-binding-errors=always

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=edukai2303
spring.datasource.url=jdbc:mysql://localhost:3306/eledoces?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# fuso horario correto para o Brasil
spring.jackson.time-zone=America/Sao_Paulo 